services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - ./docker/init-scott.sql:/docker-entrypoint-initdb.d/init-scott.sql:ro
    ports:
      - "5442:5432" # external 5442 to avoid clashing with a host-local Postgres on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  omnigate:
    # Free edition — pre-built, published image, not built from source. This repo is
    # deliberately the thin deployment package (compose + env + docs), not the source tree —
    # see https://github.com/kumarrajamani-ai/Omnigate for the full source/architecture docs.
    # Capped at 100 concurrent connections / 2 named backends (see that repo's ARCHITECTURE.md
    # §9); everything else is the same code as the commercial image.
    image: ghcr.io/kumarrajamani-ai/omnigate-free:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ORAPG_PG_HOST: postgres
      ORAPG_PG_PORT: "5432"
      ORAPG_PG_DATABASE: ${POSTGRES_DB:-postgres}
      ORAPG_PG_USER: ${POSTGRES_USER:-postgres}
      ORAPG_PG_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ORAPG_AUTH_USER: ${ORAPG_AUTH_USER:-scott}
      ORAPG_AUTH_PASSWORD: ${ORAPG_AUTH_PASSWORD:-tiger}
      # Admin console/API (/console, /api/*, /metrics) is UNAUTHENTICATED unless one of these is
      # set — uncomment and change before exposing this beyond localhost. See SKILLS.md/the main
      # repo's ARCHITECTURE.md for how to generate a password hash.
      # OMNIGATE_AUTH_USERS: "admin:<saltB64>:<hashB64>:admin"
      # OMNIGATE_AUTH_API_TOKENS: "changeme-token:admin"
      # Optional local AI assistant (chat panel + "ask AI to fix this" on query errors) — see
      # SKILLS.md for the one-time model download. Needs the model file bind-mounted in, and
      # llama-server available inside the container (not bundled in the free image) — see SKILLS.md.
      # OMNIGATE_ASSISTANT_LLAMA_SERVER_PATH: /usr/local/bin/llama-server
      # OMNIGATE_ASSISTANT_MODEL_PATH: /models/qwen2.5-1.5b-instruct-q4_k_m.gguf
    ports:
      - "1521:1521"   # Oracle wire (real Oracle Net — no Oracle DB involved, see SKILLS.md)
      - "5433:5433"   # Postgres wire
      - "3306:3306"   # MySQL wire
      - "7070:7070"   # native gRPC JDBC driver
      - "8080:8080"   # HTTP admin console/API (/console, /api/*, /metrics)
